nelmio_security:
    # Protection contre le clickjacking
    clickjacking:
        paths:
            '^/.*': SAMEORIGIN  # Changé de DENY à SAMEORIGIN pour plus de flexibilité
    # Désactivation du content type sniffing
    content_type:
        nosniff: true
    # Content Security Policy (CSP)
    csp:
        enabled: true
        report_logger_service: monolog.logger.security
        enforce:
            default-src:
                - 'self'
            script-src:
                - 'self'
                - 'unsafe-inline'  # Ajouté pour permettre les scripts inline
                - 'https://cdn.jsdelivr.net'
                - 'https://js.stripe.com/v3'
                - 'https://ga.jspm.io'
                - 'data:'
            style-src:
                - 'self'
                - 'unsafe-inline'  # Ajouté pour permettre les styles inline
                - 'https://cdn.jsdelivr.net'
                - 'https://fonts.googleapis.com'
            img-src:
                - 'self'
                - 'data:'  # Ajouté pour permettre les images en base64
            font-src:
                - 'self'
                - 'https://fonts.googleapis.com'
                - 'https://fonts.gstatic.com'
                - 'https://cdn.jsdelivr.net'
                - 'data:'
            object-src:
                - 'none'
            frame-ancestors:
                - 'self'  # Changé de 'none' à 'self' pour permettre l'intégration dans le même domaine
            base-uri:
                - 'self'
            form-action:
                - 'self'
    # Protection contre les redirections externes
    external_redirects:
        abort: true
        log: true
        allow_list:
            - '^https://trusted-domain\.com'
    # Forcer HTTPS
    forced_ssl:
        enabled: true
        hsts_max_age: 31536000 # 1 an
        hsts_subdomains: true
        hsts_preload: true
    # Signature des cookies
    signed_cookie:
        names: ['*']
    # Politique de référence
    referrer_policy:
        enabled: true
        policies:
            - 'strict-origin-when-cross-origin'  # Simplifié à une seule politique plus courante
    # Protection XSS
    xss_protection:
        enabled: true
        mode_block: true
